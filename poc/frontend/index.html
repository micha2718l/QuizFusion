<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFusion POC - Problem Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <!-- CodeMirror for code editing -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎓 QuizFusion POC</h1>
            <p>Modern Test Creation Interface</p>
        </header>

        <div class="main-layout">
            <!-- Sidebar: Problem Bank -->
            <aside class="sidebar">
                <h2>Problem Bank</h2>
                <div class="problem-list" id="problemList">
                    <div class="loading">Loading problems...</div>
                </div>
                <button class="btn btn-primary" id="newProblemBtn">➕ New Problem</button>
            </aside>

            <!-- Main Content: Editor -->
            <main class="main-content">
                <div class="editor-container">
                    <!-- Mode Selector -->
                    <div class="mode-selector">
                        <label>Editor Mode:</label>
                        <div class="tabs">
                            <button class="tab active" data-mode="visual">👁️ Visual</button>
                            <button class="tab" data-mode="hybrid">🔄 Hybrid</button>
                            <button class="tab" data-mode="code">💻 Code</button>
                        </div>
                    </div>

                    <!-- Editor Content -->
                    <div class="editor-content">
                        <!-- Problem Type Selection -->
                        <div class="form-group">
                            <label>Problem Type:</label>
                            <select id="problemType">
                                <option value="multiple_choice">Multiple Choice</option>
                                <option value="work">Work Problem</option>
                                <option value="bonus">Bonus</option>
                                <option value="information">Information</option>
                            </select>
                        </div>

                        <!-- Metadata -->
                        <div class="form-group">
                            <label>Tags:</label>
                            <input type="text" id="problemTags" placeholder="physics, energy, springs (comma-separated)">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Topic:</label>
                                <input type="text" id="problemTopic" placeholder="e.g., Energy Conservation">
                            </div>
                            <div class="form-group">
                                <label>Difficulty:</label>
                                <select id="problemDifficulty">
                                    <option value="">Select...</option>
                                    <option value="easy">Easy</option>
                                    <option value="medium">Medium</option>
                                    <option value="hard">Hard</option>
                                </select>
                            </div>
                        </div>

                        <!-- Setup Code (Hybrid/Code mode only) -->
                        <div class="form-group" id="setupCodeSection" style="display: none;">
                            <label>Setup Code (Python):</label>
                            <div class="code-editor-controls">
                                <button class="btn btn-small" id="runCodeBtn">▶ Run Code</button>
                                <button class="btn btn-small" id="showVariablesBtn">📊 Variables</button>
                            </div>
                            <textarea id="setupCode" class="code-editor"></textarea>
                            <div id="codeOutput" class="code-output" style="display: none;"></div>
                        </div>

                        <!-- Statement -->
                        <div class="form-group">
                            <label>Problem Statement:</label>
                            <textarea id="problemStatement" rows="4" placeholder="Enter the problem statement. Use {variable_name} for substitution."></textarea>
                            <div class="help-text">
                                Tip: Use {variable_name} to insert variables from your code
                            </div>
                        </div>

                        <!-- Multiple Choice Options -->
                        <div id="choicesSection" style="display: none;">
                            <label>Answer Choices:</label>
                            <div id="choicesList"></div>
                            <button class="btn btn-small" id="addChoiceBtn">+ Add Choice</button>
                        </div>

                        <!-- Work Problem Questions -->
                        <div id="questionsSection" style="display: none;">
                            <label>Questions:</label>
                            <div id="questionsList"></div>
                            <button class="btn btn-small" id="addQuestionBtn">+ Add Question</button>
                        </div>

                        <!-- Action Buttons -->
                        <div class="action-buttons">
                            <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                            <button class="btn btn-primary" id="saveProblemBtn">💾 Save Problem</button>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Preview Panel -->
            <aside class="preview-panel">
                <h2>Live Preview</h2>
                <div class="preview-controls">
                    <button class="btn btn-small" id="refreshPreviewBtn">🔄 Refresh</button>
                    <label>
                        <input type="checkbox" id="showAnswersCheckbox"> Show Answers
                    </label>
                </div>
                <div id="previewContent" class="preview-content">
                    <div class="preview-placeholder">
                        Select or create a problem to see preview
                    </div>
                </div>
                <div id="variablesDisplay" class="variables-display" style="display: none;">
                    <h3>Variables</h3>
                    <div id="variablesList"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
